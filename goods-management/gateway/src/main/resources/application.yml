server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        - id: auth-service
          uri: "lb://auth-service"
          predicates:
            - Path=/auth/**
        - id: product-service
          uri: "lb://product-service"
          predicates:
            - Path=/product/**,/order/**
